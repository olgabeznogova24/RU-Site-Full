<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ревью изображений портфолио</title>
  <style>
    :root {
      --page-bg: #f4f1ec;
      --panel-bg: #ffffff;
      --ink: #1b1815;
      --muted: #766d63;
      --line: #ddd5cc;
      --accent: #8d4f2c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: Arial, sans-serif;
      background: var(--page-bg);
    }

    .review-header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 20px;
      align-items: center;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(244, 241, 236, 0.94);
      backdrop-filter: blur(14px);
    }

    .review-header h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .review-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .review-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    button {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      background: var(--panel-bg);
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .review-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 22px;
      align-items: start;
      padding: 24px;
    }

    .portfolio-review-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      grid-auto-flow: dense;
      grid-auto-rows: 220px;
      gap: 14px;
    }

    .review-card {
      position: relative;
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 8px;
      background: #dfd8cf;
    }

    .review-card--wide {
      grid-column: span 2;
    }

    .review-card--large {
      grid-column: span 2;
      grid-row: span 2;
    }

    .review-card picture,
    .review-card img {
      display: block;
      width: 100%;
      height: 100%;
    }

    .review-card img {
      object-fit: cover;
      object-position: var(--image-pos-x, 50%) var(--image-pos-y, 50%);
      transform: scale(var(--image-zoom, 1));
      transform-origin: var(--image-pos-x, 50%) var(--image-pos-y, 50%);
    }

    .review-card__label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: flex-end;
      min-height: 58px;
      padding: 24px 12px 10px;
      color: #fff;
      font-size: 14px;
      line-height: 1.25;
      background: linear-gradient(180deg, rgba(16, 16, 16, 0), rgba(16, 16, 16, 0.78));
      pointer-events: none;
    }

    .review-card.is-active {
      outline: 3px solid var(--accent);
      outline-offset: 3px;
    }

    .review-sidebar {
      position: sticky;
      top: 92px;
      display: grid;
      gap: 14px;
    }

    .review-panel {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-bg);
    }

    .review-panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 0;
    }

    .active-title {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.35;
    }

    .control {
      display: grid;
      gap: 7px;
      margin: 0 0 14px;
    }

    .control__row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    textarea {
      width: 100%;
      min-height: 260px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      font: 12px/1.45 Consolas, "Courier New", monospace;
      resize: vertical;
      background: #fbfaf8;
    }

    .source-frame {
      display: none;
    }

    .empty-state {
      padding: 32px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel-bg);
    }

    @media (max-width: 1100px) {
      .review-shell {
        grid-template-columns: 1fr;
      }

      .review-sidebar {
        position: static;
      }
    }

    @media (max-width: 760px) {
      .review-header {
        grid-template-columns: 1fr;
      }

      .review-actions {
        justify-content: flex-start;
      }

      .review-shell {
        padding: 16px;
      }

      .portfolio-review-grid {
        grid-template-columns: 1fr;
        grid-auto-rows: auto;
      }

      .review-card,
      .review-card--wide,
      .review-card--large {
        grid-column: auto;
        grid-row: auto;
        aspect-ratio: 4 / 3;
      }
    }
  </style>
</head>
<body>
  <header class="review-header">
    <div>
      <h1>Ревью изображений портфолио</h1>
      <p>Выберите карточку и настройте положение изображения по X, Y и масштабу.</p>
    </div>
    <div class="review-actions">
      <button type="button" id="resetActive">Сбросить выбранную</button>
      <button type="button" id="copyCss">Скопировать CSS</button>
    </div>
  </header>

  <main class="review-shell">
    <section>
      <div class="portfolio-review-grid" id="reviewGrid"></div>
      <div class="empty-state" id="emptyState" hidden>Не удалось загрузить карточки из portfolio.html.</div>
    </section>

    <aside class="review-sidebar">
      <section class="review-panel">
        <h2>Настройки</h2>
        <p class="active-title" id="activeTitle">Выберите карточку в сетке.</p>

        <label class="control">
          <span class="control__row"><span>Ось X</span><span id="xValue">50%</span></span>
          <input type="range" id="xControl" min="0" max="100" step="1" value="50">
        </label>

        <label class="control">
          <span class="control__row"><span>Ось Y</span><span id="yValue">50%</span></span>
          <input type="range" id="yControl" min="0" max="100" step="1" value="50">
        </label>

        <label class="control">
          <span class="control__row"><span>Масштаб</span><span id="zoomValue">1.00</span></span>
          <input type="range" id="zoomControl" min="1" max="1.8" step="0.01" value="1">
        </label>
      </section>

      <section class="review-panel">
        <h2>CSS для переноса</h2>
        <textarea id="cssOutput" spellcheck="false"></textarea>
      </section>
    </aside>
  </main>

      var grid = document.getElementById('reviewGrid');
      var emptyState = document.getElementById('emptyState');
      var activeTitle = document.getElementById('activeTitle');
      var xControl = document.getElementById('xControl');
      var yControl = document.getElementById('yControl');
      var zoomControl = document.getElementById('zoomControl');
      var xValue = document.getElementById('xValue');
      var yValue = document.getElementById('yValue');
      var zoomValue = document.getElementById('zoomValue');
      var cssOutput = document.getElementById('cssOutput');
      var resetActive = document.getElementById('resetActive');
      var copyCss = document.getElementById('copyCss');
      var cards = [];
      var activeCard = null;

      function createCard(data) {
        var card = document.createElement('figure');
        card.className = 'review-card review-card--' + data.size;
        card.dataset.index = data.index;
        card.dataset.caption = data.caption;
        card.dataset.x = String(data.x || 50);
        card.dataset.y = String(data.y || 50);
        card.dataset.zoom = String(data.zoom || 1);

        var picture = document.createElement('picture');
        if (data.webp) {
          var nextSource = document.createElement('source');
          nextSource.srcset = data.webp;
          nextSource.type = 'image/webp';
          picture.appendChild(nextSource);
        }

        var nextImg = document.createElement('img');
        nextImg.src = data.src;
        nextImg.alt = data.alt || data.caption;
        picture.appendChild(nextImg);
        card.appendChild(picture);

        var label = document.createElement('figcaption');
        label.className = 'review-card__label';
        label.textContent = data.index + '. ' + data.caption;
        card.appendChild(label);

        applyValues(card);
        card.addEventListener('click', function () {
          selectCard(card);
        });

        return card;
      }

      function applyValues(card) {
        card.style.setProperty('--image-pos-x', card.dataset.x + '%');
        card.style.setProperty('--image-pos-y', card.dataset.y + '%');
        card.style.setProperty('--image-zoom', card.dataset.zoom);
      }

      function selectCard(card) {
        if (activeCard) activeCard.classList.remove('is-active');
        activeCard = card;
        activeCard.classList.add('is-active');
        xControl.value = activeCard.dataset.x;
        yControl.value = activeCard.dataset.y;
        zoomControl.value = activeCard.dataset.zoom;
        activeTitle.textContent = activeCard.dataset.index + '. ' + activeCard.dataset.caption;
        updateValueLabels();
      }

      function updateValueLabels() {
        xValue.textContent = xControl.value + '%';
        yValue.textContent = yControl.value + '%';
        zoomValue.textContent = Number(zoomControl.value).toFixed(2);
      }

      function updateActive() {
        if (!activeCard) return;
        activeCard.dataset.x = xControl.value;
        activeCard.dataset.y = yControl.value;
        activeCard.dataset.zoom = zoomControl.value;
        applyValues(activeCard);
        updateValueLabels();
        renderCss();
      }

      function renderCss() {
        var lines = cards.map(function (card) {
          return [
            '.portfolio-gallery__item:nth-child(' + card.dataset.index + ') {',
            '  --image-pos-x: ' + card.dataset.x + '%;',
            '  --image-pos-y: ' + card.dataset.y + '%;',
            '  --image-zoom: ' + Number(card.dataset.zoom).toFixed(2) + ';',
            '}'
          ].join('\n');
        });
        cssOutput.value = lines.join('\n\n');
      }

      function loadCards() {
        if (!embeddedCards.length) {
          emptyState.hidden = false;
          return;
        }

        embeddedCards.forEach(function (data) {
          var card = createCard(data);
          if (!card) return;
          cards.push(card);
          grid.appendChild(card);
        });

        renderCss();
        if (cards[0]) selectCard(cards[0]);
      }

      xControl.addEventListener('input', updateActive);
      yControl.addEventListener('input', updateActive);
      zoomControl.addEventListener('input', updateActive);

      resetActive.addEventListener('click', function () {
        if (!activeCard) return;
        activeCard.dataset.x = '50';
        activeCard.dataset.y = '50';
        activeCard.dataset.zoom = '1';
        selectCard(activeCard);
        applyValues(activeCard);
        renderCss();
      });

      copyCss.addEventListener('click', function () {
        cssOutput.select();
        document.execCommand('copy');
      });

      loadCards();
    })();
  </script>
  <script src="script.js"></script>
